apis:
- name: Stellary MCP Server
  description: 'Hosted remote MCP server (streamable HTTP) exposing board read/write, cockpit supervision, agent runtime,
    and auto-registered plugin tools. Bearer-authenticated. Listed in the official MCP registry as io.github.Anymfah/stellary-project-management
    (active, v0.12.0).


    No apis.json or OpenAPI is published; the declared apis.json at stellary.co/apis.json 404s. What is served is a 15KB llms.txt
    and MCP documentation. Verified 2026-09-01.


    The MCP endpoint does serve a real anonymous discovery chain: RFC 8414
    authorization-server metadata at /.well-known/oauth-authorization-server (200) and RFC 9728 protected-resource metadata
    at /.well-known/oauth-protected-resource/mcp (200), named verbatim by the 401 WWW-Authenticate challenge. Scopes:
    projects:read, projects:write, pilotage:read, pilotage:write, offline_access. Probed 2026-09-01.'
  humanURL: https://stellary.co/docs/mcp/
  baseURL: https://api.stellary.co/mcp
