note: >-
  Two real documents are served, both on the API host and both part of the MCP OAuth 2.1
  discovery chain: RFC 8414 authorization-server metadata at the host root, and RFC 9728
  protected-resource metadata at the resource-suffixed path /.well-known/oauth-protected-resource/mcp
  (the plain /.well-known/oauth-protected-resource 404s -- the suffixed path is the one the
  401 WWW-Authenticate challenge on https://api.stellary.co/mcp names). No security.txt,
  no api-catalog, no ai-plugin.json, no agent card. Every /.well-known/* path on the marketing
  host stellary.co returns 404 with a Next.js HTML error page, not a document.
