version_note: >-
  server.json and every plugin manifest in the public discovery repo declare 0.13.0
  (repo release tag 0.12.0, published 2026-08-30); the official MCP registry record still
  shows 0.12.0 as latest, published 2026-07-27. Both numbers read 2026-09-01.

deployment:
  mode: remote
  endpoint: https://api.stellary.co/mcp
  auth: oauth
  verified: probed
  note: >-
    Remote only, and the provider says so explicitly: SKILL.md states "Not supported: local
    npx/stdio servers or Dockerized copies of the backend", and the README says the hosted
    application and server implementation are not distributed from the discovery repository.
    Every client manifest in that repo (.mcp.json, .cursor-plugin, .claude-plugin,
    .grok-plugin, gemini-extension.json, plugins/stellary/.mcp.json) points at the same
    hosted URL with no install command. There is no npm/PyPI package -- the only package.json
    in the repo is `stellary-mcp-registry-metadata`, marked private, and no `stellary*`
    package exists on npm or PyPI.

transport:
  type: streamable-http
  methods: [GET, POST]
  session: stateless
  session_note: A fresh transport is created per request; no Mcp-Session-Id is required.

authentication:
  primary: OAuth 2.1 (PKCE S256, dynamic client registration, rotating refresh tokens)
  discovery:
    authorization_server_metadata: https://api.stellary.co/.well-known/oauth-authorization-server
    protected_resource_metadata: https://api.stellary.co/.well-known/oauth-protected-resource/mcp
  scopes: [projects:read, projects:write, pilotage:read, pilotage:write, offline_access]
  access_token_lifetime: 1 hour
  alternatives:
  - Personal access token (Bearer, prefix sl_) for clients that cannot complete remote OAuth
  - User JWT from the /auth flows
  - Agent token for workspace agents running queued missions
  - MCP_TOKEN, a transport gate only -- not sufficient for tools that need a user or agent identity

