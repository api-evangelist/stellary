    Input schemas require an authenticated tools/list.

tools_source: published (docs + provider SKILL.md); input schemas NOT available anonymously
tool_groups:
- name: Board read
  identity: core (human PAT or OAuth)
  tools:
  - name: list_projects
    description: List projects visible to the caller. The recommended first call after connecting.
  - name: get_project_details
    description: Read one project, including columns and delivery context.
  - name: list_cards
    description: List cards, typically filtered by column.
  - name: get_card_details
    description: Read a single card.
  - name: get_card_comments
    description: Read the comment thread on a card.
- name: Board write and collaboration
  identity: core (write scopes)
  tools:
  - name: create_card
    description: Create one card.
  - name: create_cards_bulk
    description: Create several cards in one call.
  - name: move_card
    description: Move a card between columns.
  - name: update_card
    description: Update card fields.
  - name: assign_card
    description: Assign an owner to a card.
  - name: add_comment
    description: Post a comment on a card.
- name: Cockpit and supervision
  identity: core
  tools:
  - name: get_pilotage_state
    description: Read workspace steering signals.
  - name: get_cockpit_dashboard
    description: Read the consolidated cockpit dashboard.
  - name: get_agent_status
    description: Read agent status.
  - name: list_pending_proposals
    description: List writes that autonomy policy converted into pending proposals.
- name: Agent runtime
  identity: agent token
  tools:
  - name: stellary_init
    description: Bootstrap an agent loop; returns autonomy mode, rules, skills and the filtered tool list.
  - name: get_next_mission
    description: Claim the next queued mission.
  - name: wait_for_mission
    description: Long-poll for a queued mission.
  - name: complete_mission
    description: Complete a mission; updates mission state and posts a card comment.
  - name: fail_mission
    description: Fail a mission; updates mission state and posts a card comment.
- name: Identity
  identity: any
  tools:
  - name: stellary_list_identities
    description: >-
      List the opaque identity references an OAuth connection authorized. With more than one
      identity, actingAs is required on every call.
- name: Plugin-registered tools
  identity: agent/workspace context with decrypted plugin config
  note: >-
    Installed workspace plugins auto-register tools prefixed by plugin slug. Documented plugin
    families are GitHub, Slack, Email, Discord and X. The exact list is workspace-dependent, so
    only the documented examples are recorded here -- never assume the full set.
  tools:
  - name: github_list_repos
  - name: github_create_pr
  - name: slack_post_message
  - name: email_send_email
  - name: discord_post_message
  - name: x_create_draft

governance:
  autonomy_modes:
  - mode: autonomous
    reads: execute
    writes: execute
  - mode: supervised
    reads: execute
    writes: safe tools execute; tools marked approval_required become persisted proposals
  - mode: approval
    reads: execute
    writes: every non-read tool becomes a persisted proposal
  note: >-
    Autonomy proposal checks apply to agent tokens only. A human acting through MCP acts as
    themselves and writes execute directly, still subject to permissions and scopes.

