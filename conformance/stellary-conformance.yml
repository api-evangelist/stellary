generated: '2026-09-01'
method: probed
source: >-
  live probes of https://api.stellary.co/.well-known/oauth-authorization-server,
  https://api.stellary.co/.well-known/oauth-protected-resource/mcp and https://api.stellary.co/mcp,
  plus https://stellary.co/docs/mcp/ and https://registry.modelcontextprotocol.io
note: >-
  Stellary's conformance story is entirely in the agent-protocol lane. It implements the full MCP
  OAuth discovery chain correctly -- which is unusual: most MCP servers in the catalog answer a
  bare 401 with no RFC 9728 pointer. It implements nothing from the classic REST-standards lane.

standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence:
    endpoint: https://api.stellary.co/mcp
    transport: Streamable HTTP (GET + POST, stateless, no Mcp-Session-Id)
    registry: >-
      Listed in the official MCP registry as io.github.Anymfah/stellary-project-management,
      status active, remotes[0].type streamable-http
    registry_url: https://registry.modelcontextprotocol.io/v0/servers?search=stellary
    http_status: 401
    note: Live and correctly challenging; tools/list is auth-gated.

- id: oauth2
  name: OAuth 2.1 authorization code with PKCE
  conforms: true
  evidence:
    metadata: https://api.stellary.co/.well-known/oauth-authorization-server
    http_status: 200
    code_challenge_methods_supported: [S256]
    grant_types_supported: [authorization_code, refresh_token]
    response_types_supported: [code]
    note: PKCE S256 only; no implicit or password grant advertised. Refresh-token rotation documented.

- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence:
    url: https://api.stellary.co/.well-known/oauth-authorization-server
    http_status: 200
    issuer: https://api.stellary.co/
    fields_present: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint, scopes_supported, code_challenge_methods_supported, service_documentation]

- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence:
    url: https://api.stellary.co/.well-known/oauth-protected-resource/mcp
    http_status: 200
    resource: https://api.stellary.co/mcp
    authorization_servers: [https://api.stellary.co/]
    advertised_by: >-
      The 401 on POST /mcp carries
      WWW-Authenticate: Bearer resource_metadata="https://api.stellary.co/.well-known/oauth-protected-resource/mcp"
      -- the challenge and the document agree, which is the part most implementations get wrong.

- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  evidence:
    registration_endpoint: https://api.stellary.co/register
    source: authorization-server metadata, http_status 200
    note: Endpoint advertised in metadata; not exercised (registering a client is a write against production).

- id: rfc7009
  name: OAuth 2.0 Token Revocation
  conforms: true
  evidence:
    revocation_endpoint: https://api.stellary.co/revoke
    revocation_endpoint_auth_methods_supported: [client_secret_post]
    source: authorization-server metadata, http_status 200

- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage
  conforms: true
  evidence:
    header: 'Authorization: Bearer <token>'
    challenge: 'WWW-Authenticate: Bearer ... scope="projects:read projects:write pilotage:read pilotage:write"'
    http_status: 401

- id: hsts
  name: HTTP Strict Transport Security
  conforms: true
  evidence:
    header: 'strict-transport-security: max-age=31536000; includeSubDomains'
    hosts: [stellary.co, api.stellary.co]

