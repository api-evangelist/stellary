domain_standard:
  market: agent tooling / AI project management
  standard: Model Context Protocol
  declared: true
  where: >-
    Declared in the contract surface itself, not only in marketing copy: the server is published to
    the official MCP registry under io.github.Anymfah/stellary-project-management with a
    server.json validated against
    https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json, and the live
    endpoint speaks Streamable HTTP with the MCP-specified OAuth challenge chain.
  evidence:
  - {url: 'https://registry.modelcontextprotocol.io/v0/servers?search=stellary', status: 200}
  - {url: 'https://raw.githubusercontent.com/Anymfah/stellary-mcp/main/server.json', status: 200}
  - {url: 'https://api.stellary.co/.well-known/oauth-protected-resource/mcp', status: 200}
  note: >-
    Project management has no cross-vendor data standard to conform to (no equivalent of FHIR or
    SCIM for boards and cards), so the only domain standard available in this market is the agent
    protocol -- and Stellary implements it in the contract rather than claiming it in prose.

compliance_certifications:
  published: false
  evidence: >-
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim appears on the site, and no trust center
    exists (https://stellary.co/trust/ 404, https://stellary.co/security/ 404). A DPA is published
    at https://stellary.co/dpa/ (200), which is a contractual document, not a certification.
